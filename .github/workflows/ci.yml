name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
        include:
          # Coverage + artifact build run once, on the active LTS line.
          - node-version: 22
            upload-coverage: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (dist/ with declarations)
        run: npm run build

      - name: Coverage
        if: matrix.upload-coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.upload-coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          # Public repos can upload tokenless; set CODECOV_TOKEN to raise
          # rate limits once the project is linked on codecov.io.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false